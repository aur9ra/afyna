[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afyna"
version = "0.0.0"
description = "An interactive music library organizer for importing messy downloads into an organized collection."
requires-python = ">=3.13"
dependencies = [
    "mutagen==1.48.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["afyna"]

[tool.pytest.ini_options]
testpaths = ["tests/cases"]
python_files = ["*.py"]
